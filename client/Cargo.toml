[package]
edition = "2021"
name = "stat_client"
version = "2.0.0"

rust-version = "1.95"

authors = ["airene <linfanne@gmail.com>"]
categories = ["monitoring-tools"]
description = "A simple server monitoring tool"
keywords = ["devops", "monitoring", "dashboard"]
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/airene/server-status"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
stat_common = { path = "../common" }
anyhow = "1"
bytes = { version = "1", features = ["serde"] }
chrono = "0.4"
clap = { version = "4.6", features = ["derive", "unicode"] }
lazy_static = "1.5"
log = "0.4"
once_cell = "1"
pretty_env_logger = "0.5"
prost = "0.14"
regex = "1"
reqwest = { version = "0.13", features = ["json", "rustls", "brotli", "gzip", "deflate", "stream", "socks"], default-features = false }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
sysinfo = "0.39"
tokio = { version = "1", features = ["full"] }
tonic = "0.14"

[features]
default = ["native"]
native = []
sysinfo = []
