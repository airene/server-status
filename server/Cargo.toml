[package]
name = "stat_server"
version = "2.0.0"
edition = "2021"

rust-version = "1.88"

authors = ["airene <linfanne@gmail.com>"]
categories = ["monitoring-tools"]
description = "A simple server monitoring tool"
keywords = ["devops", "monitoring", "dashboard"]
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/airene/server-status"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1"
bytes = { version = "1", features = ["serde"] }
chrono = "0.4"
clap = { version = "4.6", features = ["derive", "unicode"] }
http-auth-basic = "0.3"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["http1", "server", "tokio"] }
lazy_static = "1.5"
log = "0.4"
mime = "0.3"
mime_guess = "2.0"
once_cell = "1"
pretty_env_logger = "0.5"
prost = "0.14"
rust-embed = "8"
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = "1"
stat_common = { path = "../common" }
tokio = { version = "1", features = ["full"] }
toml = "1"
tonic = "0.14"
